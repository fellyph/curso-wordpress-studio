name: Validate multilingual content

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Content and language parity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate references and workshop plans
        run: node scripts/validate-content.mjs

      - name: Validate video slide parity
        run: node scripts/validate-video-slides.mjs

      - name: Require paired language updates
        env:
          LANGUAGE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/validate-language-parity.mjs "$LANGUAGE_BASE_SHA"
